name: Harvest from the Wayback Machine
# Randomized sweeps of the Wayback Machine's capture index for Flash Summoner.
# Runs when the harvester changes, by hand from the Actions tab, and weekly via main.
on:
  push:
    branches: [gh-pages]
    paths: ['tools/harvest.py', '.github/workflows/harvest.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: harvest
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: Sample the index
        run: python3 tools/harvest.py
        env:
          HARVEST_MINUTES: '30'
      - name: Save what was found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -q -m "Harvest: refresh Wayback indexes for Flash Summoner" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase origin gh-pages 2>git.log && git push -q origin HEAD:gh-pages 2>>git.log; then echo "::notice title=saved::pushed"; exit 0; fi
            sleep 5
          done
          echo "::error title=save failed::$(tail -c 400 git.log | tr '\n' ' ')"
          exit 1
