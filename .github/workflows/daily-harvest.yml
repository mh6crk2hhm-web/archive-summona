name: Wayback harvest every four hours
# Lives on main because GitHub only runs schedules from the default branch.
# Checks out gh-pages, where the page, the harvester and its data live.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: harvest
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: Sample the index
        run: python3 tools/harvest.py
        env:
          HARVEST_MINUTES: '60'
      - name: Save what was found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -q -m "Harvest: scheduled Wayback refresh for Flash Summoner" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase origin gh-pages 2>git.log && git push -q origin HEAD:gh-pages 2>>git.log; then echo "::notice title=saved::pushed"; exit 0; fi
            sleep 5
          done
          echo "::error title=save failed::$(tail -c 400 git.log | tr '\n' ' ')"
          exit 1
